<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Bagagem</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Cabeçalho -->
  <header class="site-header">
    <div class="header-inner">
      <div class="header-icon" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="4" y="7" width="16" height="13" rx="2" stroke="currentColor" stroke-width="1.6"/>
          <path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2" stroke="currentColor" stroke-width="1.6"/>
          <path d="M4 12h16" stroke="currentColor" stroke-width="1.6"/>
        </svg>
      </div>
      <h1>Registro de Bagagem</h1>
      <p class="subtitle">Registro audiovisual referente à bagagem extraviada e posteriormente recuperada, disponibilizado como evidência para fins de reclamação.</p>
    </div>
  </header>

  <!-- Área principal -->
  <main>
    <section class="card">

      <!-- Player de vídeo -->
      <div class="video-wrapper">
        <video controls preload="metadata" class="video-player">
          <source src="videos/mala.mp4" type="video/mp4">
          Seu navegador não suporta a reprodução de vídeo.
        </video>
      </div>

    </section>

    <footer class="site-footer">
      <p>Documento gerado para fins de registro pessoal.</p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
